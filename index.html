<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio fisica</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #0b0b0b;
            background-image: radial-gradient(circle at 20% 30%, #1a1a1a 0%, #050505 90%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            padding: 1rem;
            color: #fff;
            overflow-x: hidden;
        }

        /* 1. LOGO PROFE Y PERMISO */
        .profe-logo {
            position: absolute;
            top: -2.2rem;
            left: 1.5rem;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #ffd700;
            background: rgba(0, 0, 0, 0.85);
            padding: 0.3rem 1rem;
            border-radius: 0.8rem;
            border: 2px solid #ffd700;
            text-shadow: 0 0 10px #ffd700, 0 0 20px #ff8c00;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            z-index: 30;
            user-select: none;
        }

        .permission-banner {
            position: absolute;
            top: -2.2rem;
            right: 1.5rem;
            padding: 0.4rem 1rem;
            border-radius: 0.8rem;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            z-index: 30;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.85);
        }
        .permission-banner.locked { border: 2px solid #ff0000; color: #ff4d4d; box-shadow: 0 0 12px #ff0000; }
        .permission-banner.unlocked { border: 2px solid #00ff00; color: #00ff00; box-shadow: 0 0 12px #00ff00; }

        /* MODAL DE BIENVENIDA */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        .login-card {
            background: rgba(15, 15, 15, 0.95);
            border: 3px solid #ffcc00;
            box-shadow: 0 0 25px #ffcc00, 0 0 50px #ff0000;
            border-radius: 1.5rem;
            padding: 2.5rem;
            width: 90%;
            max-width: 420px;
            text-align: center;
        }
        .login-card h2 { color: #ffcc00; margin-bottom: 1.2rem; text-shadow: 0 0 10px #ff0000; letter-spacing: 2px; }

        .role-selector {
            display: flex; gap: 0.5rem; margin-bottom: 1.5rem; background: #1a1a1a; padding: 0.3rem; border-radius: 0.8rem; border: 1px solid #ffcc00;
        }
        .role-btn {
            flex: 1; padding: 0.6rem; border: none; background: transparent; color: #ffe680; font-weight: bold; border-radius: 0.6rem; cursor: pointer; transition: all 0.2s ease;
        }
        .role-btn.active { background: #ffcc00; color: #000; box-shadow: 0 0 10px #ffcc00; }

        .input-group { margin-bottom: 1.2rem; text-align: left; }
        .input-group label { display: block; margin-bottom: 0.4rem; color: #ffe680; font-size: 0.9rem; }
        .input-group input { width: 100%; padding: 0.8rem; border-radius: 0.8rem; border: 2px solid #ffcc00; background: #1a1a1a; color: #fff; font-size: 1rem; outline: none; }

        .btn-action {
            width: 100%; padding: 0.9rem; border-radius: 1rem; border: 2px solid #00ff00; background: rgba(0, 255, 0, 0.15); color: #00ff00; font-size: 1.1rem; font-weight: bold; cursor: pointer; box-shadow: 0 0 15px #00ff00; transition: all 0.25s ease; margin-top: 0.5rem;
        }
        .btn-action:hover { background: #00ff00; color: #000; box-shadow: 0 0 30px #00ff00; }

        /* VISTA PRINCIPAL */
        .slide-container { position: relative; width: 100%; max-width: 1100px; margin-top: 1.5rem; transition: margin-right 0.3s ease; }
        .neon-box {
            position: relative; width: 100%; min-height: 75vh; background: rgba(0, 0, 0, 0.82); border-radius: 2.5rem; display: flex; flex-direction: column; padding: 2.5rem 2.5rem 4.5rem 2.5rem; border: 5px solid #ff0000; box-shadow: 0 0 15px #ff0000, 0 0 35px #ffcc00, 0 0 70px #00ff00, inset 0 0 25px rgba(255, 0, 0, 0.25); animation: neonRYG 3s infinite alternate;
        }
        @keyframes neonRYG { 0% { border-color: #ff0000; } 50% { border-color: #ffcc00; } 100% { border-color: #00ff00; } }

        .slide-indicator { position: absolute; top: 1.2rem; right: 2rem; font-size: 0.85rem; color: #ffe680; letter-spacing: 3px; }
        .question-title { font-size: clamp(1.2rem, 2.5vw, 2rem); font-weight: 700; color: #ffffff; text-shadow: 0 0 8px #ffcc00, 0 0 18px #ff0000; text-align: center; margin-top: 0.5rem; margin-bottom: 1rem; padding-bottom: 0.8rem; border-bottom: 2px solid rgba(255, 204, 0, 0.6); }

        /* BARRA DE HERRAMIENTAS Y HERRAMIENTAS DE DIBUJO */
        .toolbar { display: flex; align-items: center; justify-content: center; gap: 0.8rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .tool-btn { background: rgba(255, 204, 0, 0.08); color: #ffe680; border: 2px solid #ffcc00; border-radius: 0.7rem; padding: 0.55rem 1.2rem; cursor: pointer; text-transform: uppercase; font-weight: bold; }
        .tool-btn.active { background: #ffcc00; color: #1a1200; }

        .color-palette { display: none; align-items: center; gap: 0.6rem; background: rgba(0,0,0,0.85); padding: 0.4rem 0.9rem; border-radius: 1rem; border: 2px solid #ffcc00; box-shadow: 0 0 10px rgba(255, 204, 0, 0.3); }
        .color-dot { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; transition: transform 0.2s; }
        .color-dot:hover, .color-dot.active { transform: scale(1.3); box-shadow: 0 0 10px #fff; }

        .btn-clear { background: rgba(255, 0, 0, 0.25); color: #ff4d4d; border: 2px solid #ff0000; border-radius: 0.7rem; padding: 0.55rem 1.2rem; cursor: pointer; font-weight: bold; display: none; }
        .btn-clear:hover { background: #ff0000; color: #fff; box-shadow: 0 0 15px #ff0000; }

        .workspace { flex: 1; position: relative; border-radius: 1.2rem; border: 2px dashed rgba(255, 204, 0, 0.5); background: rgba(15, 15, 5, 0.4); overflow: hidden; min-height: 280px; }
        .question-slide { display: none; flex-direction: column; flex: 1; height: 100%; }
        .question-slide.active { display: flex; }

        .text-answer { position: absolute; inset: 0; width: 100%; height: 100%; background: transparent; border: none; outline: none; resize: none; padding: 1.5rem; font-size: 1.3rem; color: #f0ffe0; font-family: inherit; }
        .text-answer:disabled { cursor: not-allowed; opacity: 0.7; }

        .draw-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: none; cursor: crosshair; touch-action: none; z-index: 10; }
        .workspace.draw-mode .text-answer { display: none; }
        .workspace.draw-mode .draw-canvas { display: block; }
        .workspace.read-only .draw-canvas { pointer-events: none; }

        .nav-bar { position: absolute; bottom: 1.2rem; left: 50%; transform: translateX(-50%); display: flex; gap: 1.2rem; }
        .nav-btn { background: rgba(0, 0, 0, 0.7); color: #ffe680; border: 2px solid #ffcc00; border-radius: 2rem; padding: 0.6rem 1.6rem; cursor: pointer; font-weight: bold; }
        .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }

        /* PANEL PLEGABLE TIPO MEET */
        .meet-drawer {
            position: fixed; top: 0; right: -340px; width: 340px; height: 100vh; background: rgba(18, 22, 28, 0.96); border-left: 3px solid #ffcc00; box-shadow: -5px 0 25px rgba(0,0,0,0.8); z-index: 150; transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; padding: 1.5rem 1rem;
        }
        .meet-drawer.open { right: 0; }

        .drawer-toggle {
            position: absolute; top: 50%; left: -48px; transform: translateY(-50%); width: 48px; height: 60px; background: #ffcc00; color: #000; border: none; border-radius: 12px 0 0 12px; font-size: 1.5rem; font-weight: bold; cursor: pointer; box-shadow: -4px 0 12px rgba(255, 204, 0, 0.5); display: flex; align-items: center; justify-content: center;
        }

        .drawer-header { border-bottom: 2px solid #30363d; padding-bottom: 0.8rem; margin-bottom: 1rem; }
        .drawer-header h3 { color: #ffcc00; font-size: 1.1rem; display: flex; align-items: center; gap: 0.5rem; }

        .btn-master-clear {
            width: 100%; padding: 0.75rem; background: rgba(255, 0, 0, 0.25); color: #ff4d4d; border: 2px solid #ff0000; border-radius: 0.8rem; font-weight: bold; cursor: pointer; transition: all 0.2s ease; margin-bottom: 1rem;
        }
        .btn-master-clear:hover { background: #ff0000; color: #fff; box-shadow: 0 0 15px #ff0000; }

        .student-card { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 0.8rem 1rem; margin-bottom: 0.8rem; display: flex; align-items: center; justify-content: space-between; }
        .student-info { display: flex; align-items: center; gap: 0.6rem; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #8b949e; }
        .status-dot.online { background: #3fb950; box-shadow: 0 0 8px #3fb950; }

        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #30363d; transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #238636; }
        input:checked + .slider:before { transform: translateX(22px); }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

    <!-- MODAL DE INGRESO UNIFICADO -->
    <div class="modal-overlay" id="loginModal">
        <div class="login-card">
            <h2>PENSAMIENTO CIENTIFICO</h2>

            <div class="role-selector">
                <button class="role-btn active" id="roleStudentBtn" onclick="selectRole('student')">👨‍🎓 Estudiante</button>
                <button class="role-btn" id="roleTeacherBtn" onclick="selectRole('teacher')">👨‍🏫 Profesor</button>
            </div>

            <div class="input-group">
                <label for="userName">Tu Nombre Completo:</label>
                <input type="text" id="userName" placeholder="Ej: Carlos Mamani">
            </div>

            <div class="input-group">
                <label for="roomCode">Nombre o Código de Sala:</label>
                <input type="text" id="roomCode" placeholder="Ej: QUIMI" value="QUIMI">
            </div>

            <div class="input-group" id="passGroup" style="display: none;">
                <label for="userPassword">Contraseña Docente:</label>
                <input type="password" id="userPassword" placeholder="Ingresa tu contraseña">
            </div>

            <button class="btn-action" id="btnSubmit" onclick="handleLogin()">Ingresar a la Sala</button>
        </div>
    </div>

    <!-- PANEL PLEGABLE TIPO MEET -->
    <div class="meet-drawer" id="meetDrawer">
        <button class="drawer-toggle" onclick="toggleDrawer()" title="Panel de Participantes">👥</button>
        <div class="drawer-header">
            <h3>👥 Control de Clase</h3>
            <span style="font-size: 0.8rem; color: #3fb950;" id="activeRoomTag">🟢 SALA: QUIMI</span>
        </div>

        <button class="btn-master-clear" onclick="masterClearCurrentSlide()">🧹 Limpiar Pizarra en Vivo</button>

        <div id="studentList" style="flex: 1; overflow-y: auto;">
            <p style="color: #8b949e; font-size: 0.85rem;">Esperando estudiantes...</p>
        </div>
    </div>

    <!-- VISTA PRINCIPAL DE PREGUNTAS -->
    <div class="slide-container" id="mainContainer">
        <div class="profe-logo">PROFE</div>
        
        <div class="neon-box">
            <div class="permission-banner locked" id="permBanner">🔒 MODO LECTURA</div>
            <div class="slide-indicator" id="slideIndicator">PREGUNTA 1 DE 7</div>

            <!-- PREGUNTAS 1 A 7 -->
            <script>
                const questions = [
                    "1. ¿Qué se mantiene igual en las dos caídas?",
                    "2. ¿Qué cambia entre la primera y la segunda caída?",
                    "3. La plastilina se deforma más sobre ____________ ¿por qué?",
                    "4. Dibuja la esfera como quedó después de la caída sobre la mesa",
                    "5. Dibuja la esfera como quedó después de la caída sobre la esponja",
                    "6. ¿Qué pasa si lanzo la bolita de una altura de 10 cm?",
                    "7. ¿Qué pasa si lanzo la bolita de una altura de 30 cm?"
                ];

                questions.forEach((q, idx) => {
                    const i = idx + 1;
                    document.write(`
                        <div class="question-slide ${i === 1 ? 'active' : ''}" id="slide${i}">
                            <h1 class="question-title">${q}</h1>
                            <div class="toolbar">
                                <button class="tool-btn active" id="btnKey${i}" onclick="setMode(${i}, 'keyboard')">⌨ Teclado</button>
                                <button class="tool-btn" id="btnDraw${i}" onclick="setMode(${i}, 'draw')">✎ Pizarra</button>
                                
                                <div class="color-palette" id="palette${i}">
                                    <div class="color-dot active" style="background: #00ff00;" onclick="selectColor(${i}, '#00ff00', this)"></div>
                                    <div class="color-dot" style="background: #ffcc00;" onclick="selectColor(${i}, '#ffcc00', this)"></div>
                                    <div class="color-dot" style="background: #ff0000;" onclick="selectColor(${i}, '#ff0000', this)"></div>
                                    <div class="color-dot" style="background: #00ffff;" onclick="selectColor(${i}, '#00ffff', this)"></div>
                                    <div class="color-dot" style="background: #ffffff;" onclick="selectColor(${i}, '#ffffff', this)"></div>
                                </div>

                                <button class="btn-clear" id="btnClear${i}" onclick="clearLocalCanvas(${i})">🗑️ Borrar Pizarra</button>
                            </div>
                            <div class="workspace read-only" id="workspace${i}">
                                <textarea class="text-answer" id="text${i}" placeholder="Esperando interacción..." disabled></textarea>
                                <canvas class="draw-canvas" id="canvas${i}"></canvas>
                            </div>
                        </div>
                    `);
                });
            </script>

            <div class="nav-bar">
                <button class="nav-btn" id="btnPrev" onclick="changeSlide(-1)" disabled>◀ Anterior</button>
                <button class="nav-btn" id="btnNext" onclick="changeSlide(1)">Siguiente ▶</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB3nHZf5TDhJolWch-WZnQXDzsMP4rDpVM",
            authDomain: "caida-5d67a.firebaseapp.com",
            databaseURL: "https://caida-5d67a-default-rtdb.firebaseio.com",
            projectId: "caida-5d67a",
            storageBucket: "caida-5d67a.firebasestorage.app",
            messagingSenderId: "490809721128",
            appId: "1:490809721128:web:dc34f249bbde52c6d2901d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentRole = 'student';
        let studentId = null;
        let roomCode = "";
        let canWrite = false;
        let currentSlide = 1;
        const totalSlides = 7;
        const currentColor = {};

        for(let i=1; i<=totalSlides; i++) currentColor[i] = '#00ff00';

        function selectRole(role) {
            currentRole = role;
            const studentBtn = document.getElementById('roleStudentBtn');
            const teacherBtn = document.getElementById('roleTeacherBtn');
            const passGroup = document.getElementById('passGroup');

            if (role === 'student') {
                studentBtn.classList.add('active');
                teacherBtn.classList.remove('active');
                passGroup.style.display = 'none';
            } else {
                teacherBtn.classList.add('active');
                studentBtn.classList.remove('active');
                passGroup.style.display = 'block';
            }
        }

        function toggleDrawer() {
            document.getElementById('meetDrawer').classList.toggle('open');
        }

        function handleLogin() {
            const name = document.getElementById('userName').value.trim();
            roomCode = document.getElementById('roomCode').value.trim().toUpperCase().replace(/\s+/g, '-');
            const pass = document.getElementById('userPassword').value;

            if (!name || !roomCode) {
                alert("Por favor ingresa tu nombre y el código de sala.");
                return;
            }

            document.getElementById('loginModal').style.display = 'none';

            if (currentRole === 'teacher') {
                document.getElementById('meetDrawer').style.display = 'flex';
                document.getElementById('activeRoomTag').textContent = `🟢 SALA: ${roomCode}`;
                document.getElementById('meetDrawer').classList.add('open');
                initTeacherPanel(roomCode);
            } else {
                document.getElementById('meetDrawer').style.display = 'none';
                initStudentSession(name, roomCode);
            }

            setTimeout(resizeCanvases, 300);
            listenSharedCanvasAndText(roomCode);
        }

        function initStudentSession(name, roomCode) {
            studentId = 'std_' + Date.now();
            const studentRef = db.ref(`rooms/${roomCode}/students/${studentId}`);

            studentRef.set({
                name: name,
                canWrite: false,
                online: true
            });

            studentRef.onDisconnect().update({ online: false });

            studentRef.child('canWrite').on('value', (snapshot) => {
                canWrite = snapshot.val() || false;
                updatePermissionsUI();
            });
        }

        function updatePermissionsUI() {
            const banner = document.getElementById('permBanner');
            if (canWrite) {
                banner.textContent = `✏️ PANTALLA ACTIVA (${roomCode})`;
                banner.className = "permission-banner unlocked";
            } else {
                banner.textContent = `🔒 MODO LECTURA (${roomCode})`;
                banner.className = "permission-banner locked";
            }

            for (let i = 1; i <= totalSlides; i++) {
                const ta = document.getElementById(`text${i}`);
                const ws = document.getElementById(`workspace${i}`);
                if (ta) ta.disabled = !canWrite;
                if (ws) {
                    if (canWrite) ws.classList.remove('read-only');
                    else ws.classList.add('read-only');
                }
            }
        }

        function initTeacherPanel(roomCode) {
            const roomRef = db.ref(`rooms/${roomCode}/students`);
            roomRef.on('value', (snapshot) => {
                const students = snapshot.val() || {};
                renderStudentsForTeacher(students, roomCode);
            });
        }

        function renderStudentsForTeacher(students, roomCode) {
            const listContainer = document.getElementById('studentList');
            listContainer.innerHTML = '';

            const keys = Object.keys(students);
            if (keys.length === 0) {
                listContainer.innerHTML = `<p style="color: #8b949e; font-size: 0.85rem;">No hay estudiantes conectados en <strong>${roomCode}</strong>.</p>`;
                return;
            }

            keys.forEach(id => {
                const student = students[id];
                const card = document.createElement('div');
                card.className = 'student-card';

                card.innerHTML = `
                    <div class="student-info">
                        <span class="status-dot ${student.online ? 'online' : ''}"></span>
                        <strong style="font-size: 0.95rem; color: #fff;">${student.name}</strong>
                    </div>
                    <label class="switch">
                        <input type="checkbox" ${student.canWrite ? 'checked' : ''} onchange="togglePermission('${roomCode}', '${id}', this.checked)">
                        <span class="slider"></span>
                    </label>
                `;
                listContainer.appendChild(card);
            });
        }

        function togglePermission(roomCode, studentId, canWrite) {
            db.ref(`rooms/${roomCode}/students/${studentId}`).update({ canWrite: canWrite });
        }

        function selectColor(slideNum, color, elem) {
            currentColor[slideNum] = color;
            const dots = document.querySelectorAll(`#palette${slideNum} .color-dot`);
            dots.forEach(d => d.classList.remove('active'));
            elem.classList.add('active');
        }

        function clearLocalCanvas(slideNum) {
            if (!canWrite && currentRole !== 'teacher') return;
            const canvas = document.getElementById(`canvas${slideNum}`);
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            db.ref(`rooms/${roomCode}/live/canvas${slideNum}`).set('');
        }

        function masterClearCurrentSlide() {
            clearLocalCanvas(currentSlide);
            db.ref(`rooms/${roomCode}/live/text${currentSlide}`).set('');
            document.getElementById(`text${currentSlide}`).value = '';
        }

        function listenSharedCanvasAndText(roomCode) {
            for (let i = 1; i <= totalSlides; i++) {
                const ta = document.getElementById(`text${i}`);
                const textRef = db.ref(`rooms/${roomCode}/live/text${i}`);

                ta.addEventListener('input', () => {
                    if (canWrite) textRef.set(ta.value);
                });

                textRef.on('value', (snapshot) => {
                    const val = snapshot.val();
                    if (val !== null && (!canWrite || currentRole === 'teacher')) {
                        ta.value = val;
                    }
                });

                const canvasRef = db.ref(`rooms/${roomCode}/live/canvas${i}`);
                canvasRef.on('value', (snapshot) => {
                    const imgData = snapshot.val();
                    const canvas = document.getElementById(`canvas${i}`);
                    const ctx = canvas.getContext('2d');

                    if (!imgData) {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                    } else if (!canWrite || currentRole === 'teacher') {
                        const img = new Image();
                        img.onload = () => {
                            ctx.clearRect(0, 0, canvas.width, canvas.height);
                            ctx.drawImage(img, 0, 0);
                        };
                        img.src = imgData;
                    }
                });
            }
        }

        function changeSlide(dir) {
            document.getElementById(`slide${currentSlide}`).classList.remove('active');
            currentSlide += dir;
            document.getElementById(`slide${currentSlide}`).classList.add('active');
            document.getElementById('slideIndicator').textContent = `PREGUNTA ${currentSlide} DE ${totalSlides}`;
            document.getElementById('btnPrev').disabled = currentSlide === 1;
            document.getElementById('btnNext').disabled = currentSlide === totalSlides;
            
            setTimeout(() => { resizeCanvas(currentSlide); }, 100);
        }

        function setMode(slideNum, mode) {
            const ws = document.getElementById(`workspace${slideNum}`);
            const btnKey = document.getElementById(`btnKey${slideNum}`);
            const btnDraw = document.getElementById(`btnDraw${slideNum}`);
            const palette = document.getElementById(`palette${slideNum}`);
            const btnClear = document.getElementById(`btnClear${slideNum}`);

            if (mode === 'draw') {
                ws.classList.add('draw-mode');
                btnDraw.classList.add('active');
                btnKey.classList.remove('active');
                palette.style.display = 'flex';
                btnClear.style.display = 'block';
                resizeCanvas(slideNum);
            } else {
                ws.classList.remove('draw-mode');
                btnKey.classList.add('active');
                btnDraw.classList.remove('active');
                palette.style.display = 'none';
                btnClear.style.display = 'none';
            }
        }

        function resizeCanvas(i) {
            const canvas = document.getElementById(`canvas${i}`);
            if (canvas && canvas.parentElement) {
                canvas.width = canvas.parentElement.clientWidth;
                canvas.height = canvas.parentElement.clientHeight;
            }
        }

        function resizeCanvases() {
            for (let i = 1; i <= totalSlides; i++) resizeCanvas(i);
        }
        window.addEventListener('resize', resizeCanvases);

        for (let i = 1; i <= totalSlides; i++) {
            const canvas = document.getElementById(`canvas${i}`);
            if (!canvas) continue;
            const ctx = canvas.getContext('2d');
            let drawing = false;

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            }

            function startDraw(e) {
                if (!canWrite && currentRole !== 'teacher') return;
                drawing = true;
                const pos = getPos(e);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            }

            function draw(e) {
                if (!drawing || (!canWrite && currentRole !== 'teacher')) return;
                e.preventDefault();
                const pos = getPos(e);
                ctx.lineTo(pos.x, pos.y);
                ctx.strokeStyle = currentColor[i] || '#00ff00';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.stroke();
            }

            function stopDraw() {
                if (drawing && (canWrite || currentRole === 'teacher')) {
                    drawing = false;
                    const dataUrl = canvas.toDataURL();
                    db.ref(`rooms/${roomCode}/live/canvas${i}`).set(dataUrl);
                }
                drawing = false;
            }

            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDraw);
            canvas.addEventListener('mouseleave', stopDraw);

            canvas.addEventListener('touchstart', startDraw);
            canvas.addEventListener('touchmove', draw);
            canvas.addEventListener('touchend', stopDraw);
        }
    </script>
</body>
</html>
