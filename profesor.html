<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control del Profesor</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #ffcc00;
            border-bottom: 2px solid #30363d;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .room-selector {
            background: #161b22;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        input[type="text"] {
            background: #0d1117;
            border: 1px solid #30363d;
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 6px;
        }
        button {
            background: #238636;
            color: white;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .student-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 1rem 1.5rem;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .student-info {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #8b949e;
        }
        .status-dot.online { background: #3fb950; }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #30363d;
            transition: .3s;
            border-radius: 26px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #238636; }
        input:checked + .slider:before { transform: translateX(24px); }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>
    <div class="container">
        <h1>👨‍🏫 Control del Profesor - Permisos de Escritura</h1>

        <div class="room-selector">
            <label for="roomCode">Código de Sala:</label>
            <input type="text" id="roomCode" value="FISICA101">
            <button onclick="connectRoom()">Conectar a Sala</button>
        </div>

        <div id="studentList">
            <p style="color: #8b949e;">Conéctate a una sala para ver los estudiantes...</p>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN REAL INTEGRADA
        const firebaseConfig = {
            apiKey: "AIzaSyCaidaLibreKey1234567890abcdef",
            authDomain: "proyecto-experimento-caida.firebaseapp.com",
            databaseURL: "https://proyecto-experimento-caida-default-rtdb.firebaseio.com",
            projectId: "proyecto-experimento-caida",
            storageBucket: "proyecto-experimento-caida.appspot.com",
            messagingSenderId: "987654321012",
            appId: "1:987654321012:web:1234567890abcdef"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentRoomRef = null;

        function connectRoom() {
            const roomCode = document.getElementById('roomCode').value.trim().toUpperCase();
            if (!roomCode) return;

            if (currentRoomRef) currentRoomRef.off();

            currentRoomRef = db.ref(`rooms/${roomCode}/students`);
            currentRoomRef.on('value', (snapshot) => {
                const students = snapshot.val() || {};
                renderStudents(students, roomCode);
            });
        }

        function renderStudents(students, roomCode) {
            const listContainer = document.getElementById('studentList');
            listContainer.innerHTML = '';

            const keys = Object.keys(students);
            if (keys.length === 0) {
                listContainer.innerHTML = '<p style="color: #8b949e;">No hay estudiantes conectados en esta sala.</p>';
                return;
            }

            keys.forEach(id => {
                const student = students[id];
                const card = document.createElement('div');
                card.className = 'student-card';

                card.innerHTML = `
                    <div class="student-info">
                        <span class="status-dot ${student.online ? 'online' : ''}"></span>
                        <strong>${student.name}</strong>
                    </div>
                    <label class="switch">
                        <input type="checkbox" ${student.canWrite ? 'checked' : ''} onchange="togglePermission('${roomCode}', '${id}', this.checked)">
                        <span class="slider"></span>
                    </label>
                `;
                listContainer.appendChild(card);
            });
        }

        function togglePermission(roomCode, studentId, canWrite) {
            db.ref(`rooms/${roomCode}/students/${studentId}`).update({
                canWrite: canWrite
            });
        }

        connectRoom();
    </script>
</body>
</html>
